# Configuraci\u00f3n de conexi\u00f3n a SQL Server (Ajustada para SQLEXPRESS)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CarritoUMG;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=Admin123*
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuraci\u00f3n de JPA / Hibernate
# 'update' crea las tablas autom\u00e1ticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect